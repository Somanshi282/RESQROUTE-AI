kind = "mobile"
previewPath = "/"
title = "ResQRoute AI"
version = "1.0.0"
id = "artifacts/resqroute"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25452

[services.development]
run = "pnpm --filter @workspace/resqroute run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/resqroute", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/resqroute", "run", "serve" ]

[services.env]
PORT = "25452"
BASE_PATH = "/"
